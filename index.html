<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a140e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a140e'/%3E%3Cpath d='M3 12 8 3l5 9-5-3z' fill='%23ffb347'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" />
    <title>Nebula Harrier</title>
    <style>
      /* Golden Hour HUD: line-work drawn straight onto the picture, no panels.
         Condensed aviation type, warm off-white with amber for ordnance and focus. */
      :root {
        --ink: #fff8ec;
        --ink-dim: rgba(255, 248, 236, 0.72);
        --ink-faint: rgba(255, 248, 236, 0.25);
        --amber: #ffb347;
        --lash: #8ff4ff;
        --alert: #ff5a3d;
        --ok: #c4d98a;
        --glass: rgba(16, 12, 9, 0.7);
        --glass-hi: rgba(28, 21, 15, 0.8);
        --hair: rgba(255, 248, 236, 0.2);
        --cond: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
        --text: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --shade: 0 1px 3px rgba(20, 12, 6, 0.6);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #1a140e; color: var(--ink);
        font-family: var(--text); user-select: none; -webkit-user-select: none; touch-action: none;
        overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      #game { position: absolute; inset: 0; }
      #game canvas { display: block; }

      /* ---------- HUD ---------- */
      #hud { position: absolute; inset: 0; pointer-events: none; display: none; font-family: var(--cond); color: var(--ink); text-shadow: var(--shade); }
      #hud.on { display: block; }
      .k { font-weight: 600; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
      .vitals { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: min(270px, 34vw); display: grid; gap: 9px; }
      .vrow { display: grid; grid-template-columns: 52px 30px 1fr; gap: 10px; align-items: center; }
      .vrow .n { font-weight: 600; font-size: 19px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
      .bar { position: relative; height: 3px; background: var(--ink-faint); overflow: hidden; }
      .bar > i { position: absolute; inset: 0; transform-origin: left; display: block; background: var(--ink); box-shadow: 0 0 6px rgba(255, 220, 170, 0.6); }
      #sec-fill { background: var(--amber); opacity: 0.55; }
      #sec-row.ready #sec-fill { opacity: 1; box-shadow: 0 0 9px rgba(255, 179, 71, 0.9); }
      #sec-row.ready #sec-name { color: var(--amber); }
      #sec-row.empty { opacity: 0.45; }
      #dash-fill { background: var(--ink); opacity: 0.8; }
      #whip-fill { background: var(--lash); opacity: 0.55; }
      #whip-row.ready #whip-fill { opacity: 1; box-shadow: 0 0 9px rgba(143, 244, 255, 0.9); }
      #whip-row.ready .k { color: var(--lash); }
      .sector-read { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; }
      .sector-read::after { content: ""; width: 150px; height: 1px; margin-top: 4px; background: linear-gradient(90deg, transparent, rgba(255, 248, 236, 0.8), transparent); }
      .timer { font-weight: 500; font-size: 34px; line-height: 1; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
      .score-read { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(78px, calc(env(safe-area-inset-right) + 70px)); text-align: right; display: grid; gap: 2px; }
      .score { font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
      .mult { font-weight: 600; font-size: 12px; letter-spacing: 0.2em; color: var(--ink-dim); }
      .mult b { color: var(--amber); font-size: 17px; letter-spacing: 0.02em; }
      /* Combo: kills landed in quick succession; the bar drains until the chain breaks. */
      .combo { justify-self: end; margin-top: 6px; display: grid; justify-items: end; gap: 3px; opacity: 0; transition: opacity 0.15s; }
      .combo.on { opacity: 1; }
      .combo .k { color: var(--amber); }
      .combo .k b { display: inline-block; font-size: 24px; letter-spacing: 0.02em; color: var(--ink); margin-right: 6px; font-variant-numeric: tabular-nums; }
      .combo.bump .k b { animation: bump 0.18s ease-out; }
      .combo .bar { width: 96px; }
      #combo-fill { background: var(--amber); box-shadow: 0 0 6px rgba(255, 179, 71, 0.8); }
      @keyframes bump { 0% { transform: scale(1.45); } 100% { transform: none; } }

      /* Floating kill popups, placed in screen space where the kill happened. */
      #popups { position: absolute; inset: 0; pointer-events: none; overflow: hidden; font-family: var(--cond); text-shadow: var(--shade); }
      #popups div { position: absolute; left: 0; top: 0; font-weight: 600; font-size: 15px; letter-spacing: 0.04em; color: var(--ink); white-space: nowrap; opacity: 0; }
      #popups div.hot { color: var(--amber); font-size: 19px; }
      #popups div.cores { color: var(--amber); font-size: 26px; letter-spacing: 0.12em; }
      #popups div.go { animation: popup 0.9s cubic-bezier(.2, .7, .2, 1) forwards; }
      #popups div.cores.go { animation-duration: 1.4s; }
      @keyframes popup { 0% { opacity: 0; translate: -50% -30%; scale: 0.7; } 15% { opacity: 1; translate: -50% -80%; scale: 1.1; } 70% { opacity: 1; } 100% { opacity: 0; translate: -50% -220%; scale: 1; } }
      #boons { position: absolute; right: max(22px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
      #boons span { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(255, 248, 236, 0.6);
        font-family: var(--text); font-size: 16px; position: relative; color: var(--ink); background: rgba(16, 12, 9, 0.2); }
      #boons span b { position: absolute; right: -6px; bottom: -8px; font: 700 11px var(--cond); color: var(--amber); }
      #boss { position: absolute; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(460px, 46vw);
        display: none; text-align: center; }
      #boss.on { display: grid; gap: 5px; justify-items: center; }
      #boss-name { font-weight: 600; font-size: 15px; letter-spacing: 0.26em; text-transform: uppercase; }
      #boss .bar { width: 100%; }
      #boss-fill { background: var(--alert); box-shadow: 0 0 8px rgba(255, 90, 61, 0.6); }

      #pause-btn { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
        width: 42px; height: 42px; border: 1px solid rgba(255, 248, 236, 0.6); border-radius: 0; background: rgba(16, 12, 9, 0.25); color: var(--ink);
        font: 600 14px var(--cond); letter-spacing: 0.1em; display: none; z-index: 5; cursor: pointer; }
      #pause-btn.on { display: block; }
      #pause-btn:hover, #pause-btn:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }

      /* ---------- Banner ---------- */
      #banner { position: absolute; left: 0; right: 0; top: 27%; text-align: center; pointer-events: none; opacity: 0; font-family: var(--cond); text-shadow: 0 2px 12px rgba(20, 12, 6, 0.55); }
      #banner.show { animation: banner 2.6s cubic-bezier(.2, .7, .2, 1) forwards; }
      #banner h2 { margin: 0; font-size: clamp(34px, 6.4vw, 72px); font-weight: 600; letter-spacing: 0.28em; text-indent: 0.28em; color: var(--ink); line-height: 1; }
      #banner p { margin: 14px auto 0; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 14px; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); }
      #banner p::before, #banner p::after { content: ""; width: min(120px, 12vw); height: 1px; background: rgba(255, 248, 236, 0.6); }
      #banner.warn h2 { color: var(--alert); animation: pulse 0.5s ease-in-out infinite; }
      #banner.warn p { color: #ffc2b4; }
      @keyframes banner { 0% { opacity: 0; letter-spacing: 0.5em; } 12% { opacity: 1; letter-spacing: 0.28em; } 82% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0.35; } }
      @keyframes pulse { 50% { opacity: 0.6; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      /* ---------- Screens ---------- */
      #screens { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px;
        background: linear-gradient(180deg, rgba(14, 10, 7, 0.15) 0%, rgba(14, 10, 7, 0.55) 55%, rgba(14, 10, 7, 0.82) 100%); overflow-y: auto; }
      #screens.on { display: flex; }
      .screen { width: min(1000px, 100%); max-height: 100%; text-align: center; animation: rise 0.4s cubic-bezier(.2, .7, .2, 1); text-shadow: var(--shade); }
      .logo { margin: 0; font-family: var(--cond); font-weight: 500; font-size: clamp(15px, 1.9vw, 21px); letter-spacing: 0.9em; text-indent: 0.9em; line-height: 1; color: var(--ink-dim); }
      .logo span { display: block; margin-top: 4px; font-weight: 700; font-size: clamp(56px, 11vw, 128px); letter-spacing: 0.06em; text-indent: 0.06em; color: var(--ink);
        text-shadow: 0 4px 30px rgba(40, 20, 8, 0.45); }
      .tag { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 18px; font: 600 13px var(--cond); letter-spacing: 0.42em; color: var(--amber); }
      .tag::before, .tag::after { content: ""; width: min(90px, 10vw); height: 1px; background: currentColor; opacity: 0.7; }
      h3 { margin: 0 0 8px; font: 600 clamp(22px, 3.4vw, 34px) var(--cond); letter-spacing: 0.16em; text-indent: 0.16em; color: var(--ink); text-transform: uppercase; }
      .sub { margin: 0 auto 18px; font: 600 12px var(--cond); letter-spacing: 0.22em; color: var(--ink-dim); }
      .cores { display: inline-block; font: 600 14px var(--cond); letter-spacing: 0.18em; color: var(--ink); padding: 6px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
      .cores::first-letter { color: var(--amber); }
      .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
      .btn { font: 600 15px var(--cond); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); background: rgba(16, 12, 9, 0.35);
        border: 1px solid rgba(255, 248, 236, 0.5); border-radius: 0; padding: 12px 28px; min-width: 160px; cursor: pointer;
        transition: border-color 0.12s, color 0.12s, background 0.12s; text-shadow: none; }
      .btn:hover, .btn:focus-visible, .btn:focus { outline: none; border-color: var(--amber); color: var(--amber); background: rgba(16, 12, 9, 0.55); }
      .btn:active { background: rgba(255, 179, 71, 0.12); }
      .btn.primary { color: #1a140e; background: var(--ink); border-color: var(--ink); }
      .btn.primary:hover, .btn.primary:focus { background: var(--amber); border-color: var(--amber); color: #1a140e; }
      .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
      .cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      .card { width: min(290px, 30vw); min-width: 190px; text-align: left; padding: 16px 18px; background: var(--glass); border: 1px solid var(--hair);
        border-radius: 0; color: var(--ink); cursor: pointer; font-family: var(--text); position: relative;
        transition: border-color 0.12s, background 0.12s, transform 0.15s; text-shadow: none; }
      .card:hover, .card:focus { outline: none; border-color: var(--amber); background: var(--glass-hi); transform: translateY(-2px); }
      .card.sel { border-color: rgba(255, 179, 71, 0.7); box-shadow: inset 3px 0 0 var(--amber); }
      .card.locked { opacity: 0.6; }
      .card .glyph { width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; color: var(--amber); border: 1px solid rgba(255, 179, 71, 0.6); }
      .card .name { font: 600 19px var(--cond); letter-spacing: 0.1em; text-transform: uppercase; margin: 8px 0 6px; }
      .card .name small { font-size: 13px; color: var(--ink-dim); letter-spacing: 0.08em; }
      .card .desc { font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
      .card .meta { font: 600 12px var(--cond); color: var(--amber); margin-top: 12px; letter-spacing: 0.2em; }
      .card .mods { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { font: 600 11px var(--cond); letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; color: #ffb4a0; border: 1px solid rgba(255, 90, 61, 0.6); }
      .chip.calm { color: var(--ok); border-color: rgba(196, 217, 138, 0.55); }
      .swatch { display: inline-block; width: 10px; height: 10px; vertical-align: 1px; margin-right: 8px; transform: rotate(45deg); }
      .shop { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); text-align: left; margin: 16px 0; }
      .shop .item { background: var(--glass); border: 1px solid var(--hair); padding: 14px 16px; text-shadow: none; }
      .shop .item .name { font: 600 16px var(--cond); letter-spacing: 0.14em; text-transform: uppercase; }
      .shop .item .desc { font-size: 13px; color: var(--ink-dim); margin-top: 3px; }
      .shop .item .btn { min-width: 0; width: 100%; padding: 9px 12px; font-size: 13px; }
      .pips { display: flex; gap: 4px; margin: 12px 0; }
      .pips i { width: 24px; height: 3px; background: var(--ink-faint); }
      .pips i.on { background: var(--amber); }
      .tally { font: 600 16px var(--cond); letter-spacing: 0.16em; line-height: 2.1; display: inline-block; text-align: left; margin: 6px 0; padding: 14px 26px;
        background: var(--glass); border: 1px solid var(--hair); min-width: 320px; text-shadow: none; }
      .tally b { color: var(--amber); float: right; margin-left: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .help { display: block; font: 500 12px var(--cond); letter-spacing: 0.14em; color: rgba(255, 248, 236, 0.55); margin-top: 14px; line-height: 1.8; }
      .synergy { color: var(--amber); font: 600 12px var(--cond); letter-spacing: 0.1em; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255, 179, 71, 0.35); }

      /* ---------- Touch controls ---------- */
      .touch-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      .stick-zone { position: absolute; left: 0; top: 15%; bottom: 0; width: 50%; pointer-events: auto; }
      .stick-base { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255, 248, 236, 0.7);
        background: rgba(16, 12, 9, 0.18); display: none; }
      .stick-knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 248, 236, 0.85); }
      .fire-btn { position: absolute; right: max(28px, env(safe-area-inset-right)); bottom: max(36px, env(safe-area-inset-bottom)); width: 100px; height: 100px;
        border-radius: 50%; border: 1px solid rgba(255, 248, 236, 0.75); background: rgba(16, 12, 9, 0.22); display: grid; place-items: center; pointer-events: auto;
        font: 600 15px var(--cond); letter-spacing: 0.24em; text-indent: 0.24em; color: var(--ink); }
      .fire-btn.active { border-color: var(--amber); color: var(--amber); background: rgba(255, 179, 71, 0.15); }
      /* Secondary: a conic sweep fills the ring as the cooldown recharges. */
      .alt-btn { --fill: 0; position: absolute; right: calc(max(28px, env(safe-area-inset-right)) + 104px); bottom: calc(max(36px, env(safe-area-inset-bottom)) + 62px);
        width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; pointer-events: auto;
        background: conic-gradient(rgba(255, 179, 71, 0.38) calc(var(--fill) * 360deg), rgba(16, 12, 9, 0.22) 0);
        border: 1px solid rgba(255, 248, 236, 0.5); font: 600 12px var(--cond); letter-spacing: 0.16em; text-indent: 0.16em; text-transform: uppercase; color: var(--ink-dim); }
      .alt-btn.ready { border-color: var(--amber); color: var(--amber); background: rgba(255, 179, 71, 0.22); box-shadow: 0 0 14px rgba(255, 179, 71, 0.5); }
      .alt-btn.empty { opacity: 0.35; }
      /* Whip: sits above the fire button, cyan for hard light. */
      .whip-btn { right: calc(max(28px, env(safe-area-inset-right)) + 13px); bottom: calc(max(36px, env(safe-area-inset-bottom)) + 112px);
        background: conic-gradient(rgba(143, 244, 255, 0.38) calc(var(--fill) * 360deg), rgba(16, 12, 9, 0.22) 0); }
      .whip-btn.ready { border-color: var(--lash); color: var(--lash); background: rgba(143, 244, 255, 0.2); box-shadow: 0 0 14px rgba(143, 244, 255, 0.5); }

      /* ---------- Orientation lock overlay ---------- */
      #rotate { position: absolute; inset: 0; z-index: 50; display: none; background: #1a140e;
        align-items: center; justify-content: center; flex-direction: column; gap: 18px; font: 600 15px var(--cond);
        letter-spacing: 0.3em; color: var(--ink); text-align: center; padding: 16px; }
      #rotate .phone { width: 40px; height: 70px; border: 1px solid var(--ink); border-radius: 6px; animation: rot 1.8s ease-in-out infinite; }
      #rotate .sub { font-size: 11px; letter-spacing: 0.2em; opacity: 0.7; }
      @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

      .fps-meter { position: fixed; left: 8px; bottom: 8px; font: 11px ui-monospace, monospace; color: #fff; z-index: 60; background: rgba(0, 0, 0, 0.55); padding: 2px 6px; }
      @media (max-height: 480px) {
        .logo span { font-size: 52px; } .tag { margin: 6px 0 10px; } .card { padding: 11px 13px; } .card .desc { font-size: 12px; }
        .btn { padding: 9px 18px; } .help { display: none; } h3 { margin-bottom: 4px; } .card .glyph { width: 32px; height: 32px; font-size: 18px; }
        .vitals { gap: 6px; } .timer, .score { font-size: 26px; }
      }
      @media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: 2.6s; animation-timing-function: steps(1); } .screen { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="hud">
        <div class="vitals">
          <div class="vrow"><span class="k">Health</span><span class="n" id="hp-num">100</span><div class="bar" id="hp-bar"><i id="hp-fill"></i></div></div>
          <div class="vrow" id="whip-row"><span class="k">Whip</span><span class="n"></span><div class="bar"><i id="whip-fill"></i></div></div>
          <div class="vrow" id="sec-row"><span class="k" id="sec-name">—</span><span class="n" id="sec-num"></span><div class="bar"><i id="sec-fill"></i></div></div>
          <div class="vrow"><span class="k">Boost</span><span class="n"></span><div class="bar"><i id="dash-fill"></i></div></div>
        </div>
        <div class="sector-read">
          <div class="k" id="hud-sector">SECTOR 1</div>
          <div class="timer" id="hud-timer">90</div>
        </div>
        <div class="score-read">
          <div class="score" id="hud-score">0</div>
          <div class="mult"><b id="hud-mult">×1.0</b> CHAIN</div>
          <div class="combo" id="combo"><span class="k"><b id="combo-n">0</b>COMBO</span><div class="bar"><i id="combo-fill"></i></div></div>
        </div>
        <div id="boons"></div>
        <div id="boss">
          <div class="k">Apex beast</div>
          <div id="boss-name"></div>
          <div class="bar"><i id="boss-fill"></i></div>
        </div>
      </div>
      <div id="popups"></div>
      <div id="banner"><h2></h2><p></p></div>
      <button id="pause-btn" aria-label="Pause">II</button>
      <div id="screens"></div>
      <div id="rotate"><div class="phone"></div>ROTATE TO LANDSCAPE<span class="sub">or tap to play fullscreen</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
